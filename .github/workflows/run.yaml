name: Axeq

on:
  workflow_dispatch:
    inputs:
      repository-owner:
        description: "GitHub repository owner (the 'owner' in 'owner/name')"
        type: string
        required: true
      repository-name:
        description: "GitHub repository name (the 'name' in 'owner/name')"
        type: string
        required: true
      trigger-type:
        description: "Trigger Type"
        type: choice
        required: true
        options:
          - schedule
          - pull_request
          - pull_request_comment
      trigger-data:
        description: "Trigger Data"
        type: string
        required: false

env:
  GITHUB_APP_ID: "4919824"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: go build -trimpath -o axeq .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: axeq-binary
          path: axeq
          if-no-files-found: error
          retention-days: 1

  run:
    name: Run
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: axeq-binary
          path: ${{ runner.temp }}

      - name: Make binary executable
        shell: bash
        # Artifacts don't preserve file modes, so restore the exec bit.
        run: chmod +x "$RUNNER_TEMP/axeq"

      - name: Install ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify dependencies
        shell: bash
        run: |
          set -euo pipefail
          claude --version
          ffmpeg -version | head -n 1

      - name: Mint app JWT
        id: jwt
        shell: bash
        env:
          APP_ID: ${{ env.GITHUB_APP_ID }}
          PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM_GITHUB_APP }}
        run: |
          set -euo pipefail

          if [[ -z "$PRIVATE_KEY_PEM" ]]; then
            echo "::error::secrets.PRIVATE_KEY_PEM_GITHUB_APP is empty" >&2
            exit 1
          fi

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$PRIVATE_KEY_PEM" > "$key_file"

          now="$(date +%s)"
          header="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)"
          # iat 60s in the past guards against clock drift; exp max is 10 min.
          payload="$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$APP_ID" | b64url)"
          signature="$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key_file" | b64url)"

          jwt="${header}.${payload}.${signature}"
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> "$GITHUB_OUTPUT"

      - name: Resolve installation for owner
        id: installation
        shell: bash
        env:
          JWT: ${{ steps.jwt.outputs.jwt }}
          OWNER: ${{ inputs.repository-owner }}
        run: |
          set -euo pipefail

          api() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $JWT" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          # Owner may be an org or a user; try org first, fall back to user.
          if ! body="$(api "https://api.github.com/orgs/${OWNER}/installation" 2>/dev/null)"; then
            body="$(api "https://api.github.com/users/${OWNER}/installation")"
          fi

          installation_id="$(jq -r '.id // empty' <<< "$body")"
          if [[ -z "$installation_id" ]]; then
            echo "::error::No installation of app $GITHUB_APP_ID found for owner '$OWNER'" >&2
            echo "$body" >&2
            exit 1
          fi

          echo "Installation id for '$OWNER': $installation_id"
          echo "id=$installation_id" >> "$GITHUB_OUTPUT"

      - name: Create installation token
        id: token
        shell: bash
        env:
          JWT: ${{ steps.jwt.outputs.jwt }}
          INSTALLATION_ID: ${{ steps.installation.outputs.id }}
          REPOSITORY_NAME: ${{ inputs.repository-name }}
        run: |
          set -euo pipefail

          # Scope the token to just the target repository.
          body="$(jq -cn --arg repo "$REPOSITORY_NAME" '{repositories: [$repo]}')"

          response="$(curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $JWT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$body" \
            "https://api.github.com/app/installations/${INSTALLATION_ID}/access_tokens")"

          token="$(jq -r '.token // empty' <<< "$response")"
          if [[ -z "$token" ]]; then
            echo "::error::Installation token response had no token" >&2
            jq 'del(.token)' <<< "$response" >&2
            exit 1
          fi

          echo "::add-mask::$token"
          echo "installation-token=$token" >> "$GITHUB_OUTPUT"
          echo "Token expires at: $(jq -r '.expires_at' <<< "$response")"

      # A pull_request trigger audits the pull request's head; trigger-data is
      # its number. Other triggers audit the default branch (empty ref).
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository-owner }}/${{ inputs.repository-name }}
          ref: ${{ inputs.trigger-type == 'pull_request' && format('refs/pull/{0}/head', inputs.trigger-data) || '' }}
          token: ${{ steps.token.outputs.installation-token }}
          persist-credentials: false

      - name: Create output dir
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/axeq-output"

      - name: Run axeq
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ steps.token.outputs.installation-token }}
          REPOSITORY: ${{ inputs.repository-owner }}/${{ inputs.repository-name }}
          TRIGGER_TYPE: ${{ inputs.trigger-type }}
          TRIGGER_DATA: ${{ inputs.trigger-data }}
        run: |
          set -euo pipefail

          args=("$TRIGGER_TYPE")
          if [[ -n "$TRIGGER_DATA" ]]; then
            args+=("$TRIGGER_DATA")
          fi
          args+=(--output-dir "$RUNNER_TEMP/axeq-output")
          if [[ "$TRIGGER_TYPE" == "pull_request" ]]; then
            args+=(--repository "$REPOSITORY")
          fi

          "$RUNNER_TEMP/axeq" "${args[@]}"

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axeq-output
          path: ${{ runner.temp }}/axeq-output
          if-no-files-found: warn
          retention-days: 30
